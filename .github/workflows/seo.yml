name: SEO validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run check:seo -- --start-server --output seo-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-validation
          path: |
            seo-validation.json
            seo-server.log
